<style>
.calculator-container {
    max-width: 900px;
    margin: 2rem auto;
    padding: 30px;
    border-radius: 12px;
    background-color: #ffffff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

.calculator-container h2 {
    color: #2c3e50;
    margin-bottom: 25px;
    font-size: 24px;
    text-align: center;
    border-bottom: 2px solid #eef2f7;
    padding-bottom: 15px;
}

.calculator {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.global-settings {
    background-color: #f8fafc;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    margin-bottom: 25px;
}

.global-settings label {
    font-weight: 600;
    color: #2d3748;
    display: block;
    margin-bottom: 8px;
}

.global-settings input {
    width: 100%;
    padding: 10px;
    border: 2px solid #e2e8f0;
    border-radius: 6px;
    font-size: 16px;
    transition: border-color 0.2s ease;
}

.global-settings input:focus {
    border-color: #4299e1;
    outline: none;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
}

.input-group {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    margin-bottom: 15px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.input-group:hover {
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    transform: translateY(-2px);
}

.field-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid #edf2f7;
}

.field-title {
    font-size: 18px;
    color: #2d3748;
    margin: 0;
    font-weight: 600;
}

.remove-field {
    background-color: #fc8181;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.2s ease;
}

.remove-field:hover {
    background-color: #f56565;
}

.field-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 15px;
}

.field-row > div {
    display: flex;
    flex-direction: column;
}

.field-row label {
    font-weight: 500;
    color: #4a5568;
    margin-bottom: 8px;
}

.field-row input,
.field-row select {
    padding: 10px;
    border: 2px solid #e2e8f0;
    border-radius: 6px;
    font-size: 14px;
    transition: all 0.2s ease;
}

.field-row input:focus,
.field-row select:focus {
    border-color: #4299e1;
    outline: none;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
}

.field-row select {
    background-color: white;
    cursor: pointer;
}

.action-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    justify-content: center;
}

.action-buttons button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.add-field {
    background-color: #48bb78;
    color: white;
}

.add-field:hover {
    background-color: #38a169;
}

.add-field:disabled {
    background-color: #9ae6b4;
    cursor: not-allowed;
}

.action-buttons button:last-child {
    background-color: #4299e1;
    color: white;
}

.action-buttons button:last-child:hover {
    background-color: #3182ce;
}

#result {
    margin-top: 25px;
    padding: 20px;
    background-color: #f7fafc;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

#result h3 {
    color: #2d3748;
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 20px;
}

#result h4 {
    color: #4a5568;
    margin: 15px 0 10px;
    font-size: 16px;
}

#result p {
    margin: 8px 0;
    color: #4a5568;
    font-size: 15px;
}

.error-message {
    color: #e53e3e;
    background-color: #fff5f5;
    border: 1px solid #feb2b2;
    padding: 12px;
    border-radius: 6px;
    margin-top: 10px;
    font-weight: 500;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .field-row {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .calculator-container {
        margin: 1rem;
        padding: 15px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.input-group {
    animation: fadeIn 0.3s ease-out;
}
</style>

<div class="calculator-container">
    <h2>OpenSearch k-NN Vector Fields Calculator</h2>
    <div class="calculator">
        <div class="global-settings">
            <div class="field-row">
                <div>
                    <label for="totalDocuments">Total Documents:</label>
                    <input type="number" id="totalDocuments" min="1"
                           placeholder="Total number of documents"
                           aria-label="Total number of documents">
                </div>
            </div>
        </div>

        <div id="fields-container">
            <!-- Fields will be added here dynamically -->
        </div>

        <div class="action-buttons">
            <button onclick="addField()" class="add-field" id="addFieldButton"
                    aria-label="Add new field">
                Add Field
            </button>
            <button onclick="calculateMemory()" aria-label="Calculate total memory">
                Calculate Total Memory
            </button>
        </div>

        <div id="result" aria-live="polite">Total Estimated Memory: </div>
    </div>
</div>
